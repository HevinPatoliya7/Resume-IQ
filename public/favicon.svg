<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- The exact score-gradient from the old logo -->
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="7%" stop-color="#18011f" />
      <stop offset="37%" stop-color="#b600a8" />
      <stop offset="72%" stop-color="#7621b0" />
      <stop offset="100%" stop-color="#be4c00" />
    </linearGradient>
  </defs>

  <!-- Clean, bold letter R using the gradient -->
  <text 
    x="50%" 
    y="78%" 
    font-family="'Kanit', 'Arial Black', sans-serif" 
    font-size="440" 
    font-weight="900" 
    text-anchor="middle" 
    fill="url(#scoreGrad)"
  >R</text>
</svg>
